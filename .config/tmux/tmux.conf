set -g allow-passthrough all
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g renumber-windows

# Mouse selection/scrolling and room for long command output.
set -g mouse on
set -g history-limit 100000

# Advertise full color support and undo the inherited color-disable flag.
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-256color:RGB'
set-environment -gu NO_COLOR
set-environment -g COLORTERM truecolor
set-environment -g TZ America/Los_Angeles
# SSH arrives as xterm-256color; mark kitty so yazi picks kitty graphics, not sixel
set-environment -g KITTY_WINDOW_ID 1

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

#Binds
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-j select-pane -U
bind -n M-k select-pane -D

bind -n M-L next-window
bind -n M-H previous-window

# Alt-p toggles a persistent "popup" session in a floating window.
# Inside it, Alt-p detaches (hides it); the session keeps running.
bind -n M-p if -F '#{==:#{session_name},popup}' 'detach-client' 'display-popup -w 80% -h 80% -E "env -u TMUX tmux new-session -A -s popup"'

#Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'dracula/tmux'
# set -g @plugin 'hiroppy/tmux-agent-sidebar'

# Dracula status bar
set -g @dracula-plugins 'git cwd cpu-usage ram-usage ssh-session time'
set -g @dracula-show-powerline true
set -g @dracula-show-flags true
set -g @dracula-refresh-rate 5
set -g @dracula-show-empty-plugins false

